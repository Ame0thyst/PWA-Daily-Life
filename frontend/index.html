<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Daily Journal — Ruang Cerita Pribadi offline-first dengan analitik mood dan multi-user" />
  <meta name="theme-color" content="#080B12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daily Journal" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Daily Journal — Ruang Cerita Pribadi</title>
  <link rel="stylesheet" href="/src/styles/app.css" />
</head>
<body class="font-sans text-[15px] antialiased selection:bg-orange-500/30 selection:text-white">

  <!-- 1. Opening / Splash Screen -->
  <div id="splash-screen" class="fixed inset-0 z-60 flex items-center justify-center bg-[#080B12] transition-all"></div>

  <!-- 2. Lock Screen (PIN & Biometric) -->
  <div id="lock-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#080B12] hidden"></div>

  <!-- 3. Main App Container (Desktop Sidebar + Main App Grid) -->
  <div id="app" class="hidden min-h-screen flex flex-col md:flex-row">

    <!-- DESKTOP / TABLET SIDEBAR -->
    <aside id="desktop-sidebar"
      class="hidden md:flex md:w-64 lg:w-72 shrink-0 flex-col justify-between border-r border-white/10 p-6 glass-panel sticky top-0 h-screen select-none">
      
      <!-- Logo Branding -->
      <div class="flex flex-col gap-8">
        <div class="flex items-center gap-3">
          <div class="size-11 rounded-2xl bg-gradient-to-br from-amber-200/20 to-purple-500/20 border border-white/20 flex items-center justify-center shadow-lg shadow-purple-500/10">
            <span class="font-serif text-2xl font-black text-white italic drop-shadow-sm">D</span>
          </div>
          <div class="flex flex-col">
            <h1 class="font-serif text-lg font-bold text-white tracking-tight leading-tight">Daily Journal</h1>
            <span class="text-xs text-slate-400 font-sans">Ruang Cerita Pribadi</span>
          </div>
        </div>

        <!-- Sidebar Navigation Links -->
        <nav class="flex flex-col gap-2">
          <a href="#/write" data-tab="write"
            class="nav-tab flex items-center gap-3.5 rounded-2xl px-4 py-3 text-sm text-slate-300 transition-all cursor-pointer">
            <span class="text-lg">✍️</span>
            <span class="font-medium">Tulis</span>
          </a>
          <a href="#/timeline" data-tab="timeline"
            class="nav-tab flex items-center gap-3.5 rounded-2xl px-4 py-3 text-sm text-slate-300 transition-all cursor-pointer">
            <span class="text-lg">📅</span>
            <span class="font-medium">Timeline</span>
          </a>
          <a href="#/analytics" data-tab="analytics"
            class="nav-tab flex items-center gap-3.5 rounded-2xl px-4 py-3 text-sm text-slate-300 transition-all cursor-pointer">
            <span class="text-lg">📊</span>
            <span class="font-medium">Analitik</span>
          </a>
          <a href="#/settings" data-tab="settings"
            class="nav-tab flex items-center gap-3.5 rounded-2xl px-4 py-3 text-sm text-slate-300 transition-all cursor-pointer">
            <span class="text-lg">⚙️</span>
            <span class="font-medium">Pengaturan</span>
          </a>
        </nav>
      </div>

      <!-- Sidebar User Profile Capsule at bottom -->
      <div id="sidebar-user-capsule" class="flex items-center justify-between rounded-2xl border border-white/10 bg-white/[0.04] p-3 cursor-pointer hover:bg-white/[0.08] transition">
        <div class="flex items-center gap-2.5">
          <div id="sidebar-avatar-img-box" class="size-9 rounded-full overflow-hidden border border-amber-400/50 bg-amber-500/20 flex items-center justify-center font-bold text-amber-300 text-sm">
            A
          </div>
          <div class="flex flex-col min-w-0">
            <span id="sidebar-username-text" class="text-xs font-semibold text-white truncate max-w-[120px]">Alif</span>
            <span class="text-[10px] text-slate-400">Ketuk untuk profil</span>
          </div>
        </div>
        <span class="text-slate-400 text-xs">✏️</span>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA & TOP HEADER -->
    <div class="flex-1 flex flex-col min-h-screen">
      <!-- Top Header Bar -->
      <header id="app-header"
        class="sticky top-0 z-20 flex items-center justify-between border-b border-white/10 bg-[#080B12]/80 px-4 sm:px-8 py-3.5 backdrop-blur-xl pt-[env(safe-area-inset-top)]">
        
        <!-- Mobile Logo (Visible only on mobile) -->
        <div class="flex items-center gap-2.5 md:hidden">
          <div class="size-8 rounded-xl bg-gradient-to-br from-amber-200/20 to-purple-500/20 border border-white/20 flex items-center justify-center">
            <span class="font-serif text-base font-black text-white italic">D</span>
          </div>
          <span class="font-serif font-bold text-white text-base">Daily Journal</span>
        </div>

        <!-- Desktop empty placeholder for flex alignment -->
        <div class="hidden md:block"></div>

        <!-- Top Right Actions: Sync, Notif, Theme, User Avatar -->
        <div class="flex items-center gap-2.5 sm:gap-3">
          <!-- Sync Pill -->
          <div id="sync-pill-container"></div>

          <!-- Notifikasi Button -->
          <button type="button" id="btn-header-notif" title="Notifikasi Jurnal"
            class="hidden sm:inline-flex items-center gap-1.5 rounded-full border border-white/10 bg-white/[0.05] px-3 py-1.5 text-xs font-medium text-slate-300 hover:bg-white/[0.1] hover:text-white transition cursor-pointer">
            <span>🔔</span> <span>Notifikasi</span>
          </button>

          <!-- Tema Button -->
          <button type="button" id="btn-header-theme" title="Ganti Tema Tampilan"
            class="inline-flex items-center gap-1.5 rounded-full border border-white/10 bg-white/[0.05] px-3 py-1.5 text-xs font-medium text-slate-300 hover:bg-white/[0.1] hover:text-white transition cursor-pointer">
            <span>🎨</span> <span class="hidden sm:inline">Tema</span>
          </button>

          <!-- Profile Avatar Button -->
          <button type="button" id="btn-header-profile" title="Profil Pengguna"
            class="flex items-center gap-1.5 rounded-full border border-white/20 bg-white/[0.06] p-1 pr-2 sm:pr-2.5 hover:border-amber-400/60 transition cursor-pointer active:scale-95">
            <div id="header-avatar-circle"
              class="size-7 sm:size-7.5 rounded-full overflow-hidden border border-amber-400/60 bg-amber-500/20 flex items-center justify-center font-bold text-amber-300 text-xs">
              A
            </div>
            <span id="header-username-badge" class="text-xs font-semibold text-white max-w-[70px] truncate hidden sm:inline">Alif</span>
          </button>
        </div>
      </header>

      <!-- Main Content Container with liquid transition wrapper -->
      <main id="main-content"
        class="mx-auto w-full max-w-4xl flex-1 px-4 sm:px-8 pb-28 pt-6 md:pb-12 transition-all">
      </main>
    </div>

    <!-- MOBILE FLOATING BOTTOM NAVIGATION DOCK (Hidden on md and above) -->
    <nav id="bottom-nav"
      class="md:hidden fixed inset-x-3 bottom-3 z-30 rounded-3xl border border-white/15 bg-[#121622]/90 pb-[env(safe-area-inset-bottom)] backdrop-blur-2xl shadow-2xl">
      <ul class="flex justify-around items-center px-2 py-1.5">
        <li>
          <a href="#/write" data-tab="write"
            class="nav-tab flex min-h-12 min-w-16 flex-col items-center justify-center gap-0.5 rounded-2xl px-3 py-1
                   text-xs text-slate-400 transition-all cursor-pointer active:scale-90">
            <span class="text-lg">✍️</span>
            <span class="text-[11px] font-medium leading-none">Tulis</span>
          </a>
        </li>
        <li>
          <a href="#/timeline" data-tab="timeline"
            class="nav-tab flex min-h-12 min-w-16 flex-col items-center justify-center gap-0.5 rounded-2xl px-3 py-1
                   text-xs text-slate-400 transition-all cursor-pointer active:scale-90">
            <span class="text-lg">📅</span>
            <span class="text-[11px] font-medium leading-none">Timeline</span>
          </a>
        </li>
        <li>
          <a href="#/analytics" data-tab="analytics"
            class="nav-tab flex min-h-12 min-w-16 flex-col items-center justify-center gap-0.5 rounded-2xl px-3 py-1
                   text-xs text-slate-400 transition-all cursor-pointer active:scale-90">
            <span class="text-lg">📊</span>
            <span class="text-[11px] font-medium leading-none">Analitik</span>
          </a>
        </li>
        <li>
          <a href="#/settings" data-tab="settings"
            class="nav-tab flex min-h-12 min-w-16 flex-col items-center justify-center gap-0.5 rounded-2xl px-3 py-1
                   text-xs text-slate-400 transition-all cursor-pointer active:scale-90">
            <span class="text-lg">⚙️</span>
            <span class="text-[11px] font-medium leading-none">Pengaturan</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"
    class="fixed bottom-24 left-1/2 z-50 -translate-x-1/2 md:bottom-8 pointer-events-none"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

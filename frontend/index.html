<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Daily Journal — jurnal harian pribadi offline-first dengan analitik mood" />
  <meta name="theme-color" content="#FAF6EE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Journal" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Daily Journal</title>
  <link rel="stylesheet" href="/src/styles/app.css" />
</head>
<body class="min-h-dvh bg-cream font-sans text-[15px] text-ink antialiased">

  <!-- Lock Screen -->
  <div id="lock-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-cream"></div>

  <!-- App Shell -->
  <div id="app" class="hidden">
    <!-- Header -->
    <header id="app-header"
      class="sticky top-0 z-20 flex items-center justify-between border-b bg-paper/95 px-4 py-3 backdrop-blur
             pt-[env(safe-area-inset-top)]">
      <h1 id="header-title" class="text-lg font-semibold text-ink">Daily Journal</h1>
      <div id="sync-pill-container"></div>
    </header>

    <!-- Main Content -->
    <main id="main-content"
      class="mx-auto max-w-[680px] px-4 pb-24 pt-4 md:pb-8 md:pl-24">
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav"
      class="fixed inset-x-0 bottom-0 z-10 border-t bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur
             md:inset-x-auto md:inset-y-0 md:left-0 md:w-20 md:border-t-0 md:border-r md:pb-0">
      <ul class="flex justify-around md:h-full md:flex-col md:items-center md:justify-start md:gap-2 md:pt-6">
        <li>
          <a href="#/write" data-tab="write"
            class="nav-tab flex min-h-14 min-w-16 flex-col items-center justify-center gap-0.5 rounded-field px-3
                   text-xs text-ink-muted transition-colors duration-150">
            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
            </svg>
            <span>Tulis</span>
          </a>
        </li>
        <li>
          <a href="#/timeline" data-tab="timeline"
            class="nav-tab flex min-h-14 min-w-16 flex-col items-center justify-center gap-0.5 rounded-field px-3
                   text-xs text-ink-muted transition-colors duration-150">
            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
            </svg>
            <span>Timeline</span>
          </a>
        </li>
        <li>
          <a href="#/analytics" data-tab="analytics"
            class="nav-tab flex min-h-14 min-w-16 flex-col items-center justify-center gap-0.5 rounded-field px-3
                   text-xs text-ink-muted transition-colors duration-150">
            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
            </svg>
            <span>Analitik</span>
          </a>
        </li>
        <li>
          <a href="#/settings" data-tab="settings"
            class="nav-tab flex min-h-14 min-w-16 flex-col items-center justify-center gap-0.5 rounded-field px-3
                   text-xs text-ink-muted transition-colors duration-150">
            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span>Pengaturan</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"
    class="fixed bottom-20 left-1/2 z-50 -translate-x-1/2 md:bottom-8"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
